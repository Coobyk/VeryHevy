name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --console=plain

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk VeryHevy-debug.apk
          cp app/build/outputs/apk/release/app-release.apk VeryHevy-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            VeryHevy-debug.apk
            VeryHevy-release.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VeryHevy build ${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }}.

            - `VeryHevy-release.apk` — release build (debug-signed)
            - `VeryHevy-debug.apk` — debug build
          files: |
            VeryHevy-debug.apk
            VeryHevy-release.apk
