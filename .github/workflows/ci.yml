name: CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/veryhevy.jks"

      - name: Build and test
        run: ./gradlew build --console=plain
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ runner.temp }}/veryhevy.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "VeryHevy-${{ github.run_number }}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "VeryHevy-${{ github.run_number }}-release.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            VeryHevy-${{ github.run_number }}-debug.apk
            VeryHevy-${{ github.run_number }}-release.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: VeryHevy build ${{ github.run_number }}
          body: |
            Automated build from commit ${{ github.sha }} (build ${{ github.run_number }}).

            - `VeryHevy-${{ github.run_number }}-release.apk` — release build
            - `VeryHevy-${{ github.run_number }}-debug.apk` — debug build

            All builds since build 16 are signed with the same key, so you can install any newer APK directly over an older one.
          files: |
            VeryHevy-${{ github.run_number }}-debug.apk
            VeryHevy-${{ github.run_number }}-release.apk
